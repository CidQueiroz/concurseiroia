name: Deploy AprovaTeck (Firebase Hosting)

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout do Repositório
        uses: actions/checkout@v4

      - name: ⚙️ Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: 'https://npm.pkg.github.com'
          scope: '@cidqueiroz'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NODE_AUTH_TOKEN || secrets.PAT_GITHUB || secrets.GITHUB_TOKEN }}

      - name: 📦 Instalar Dependências do Frontend
        run: |
          cd frontend
          echo "@cidqueiroz:registry=https://npm.pkg.github.com" > .npmrc
          echo "//npm.pkg.github.com/:_authToken=${NODE_AUTH_TOKEN}" >> .npmrc
          npm install --legacy-peer-deps
          npm install @cidqueiroz/cdkteck-ui@latest --legacy-peer-deps
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NODE_AUTH_TOKEN || secrets.PAT_GITHUB }}

      - name: 🧪 Executar Testes Unitários (Vitest)
        run: |
          cd frontend
          npm run test
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || 'https://qyspbniwwhutvlzjhaey.supabase.co' }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY || 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.mock_ci_key_aprovateck' }}

      - name: 🏗️ Compilar Bundle de Produção (Vite + TypeScript)
        run: |
          cd frontend
          npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || 'https://qyspbniwwhutvlzjhaey.supabase.co' }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY || 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.mock_ci_key_aprovateck' }}

      - name: 🚀 Instalar Firebase CLI & Deploy
        run: |
          npm install -g firebase-tools
          firebase deploy --only hosting:aprovateck --token "${{ secrets.FIREBASE_TOKEN }}"

